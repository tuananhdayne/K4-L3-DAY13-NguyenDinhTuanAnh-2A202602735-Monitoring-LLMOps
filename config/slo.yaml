service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: "Baseline hệ thống đạt P95 latency ~973ms, TTFT ~50ms và retrieval success 100%. Ngưỡng latency 3000ms (~3x P95 baseline) được chọn làm ranh giới an toàn cho trải nghiệm người dùng trước khi bị gián đoạn. Mục tiêu SLO là 99.5% fast & successful requests trong chu kỳ 28 ngày, tương đương Error Budget 0.5%. Cụ thể: nếu hệ thống tiếp nhận 10,000 requests trong 28 ngày, Error Budget cho phép tối đa 50 requests bị lỗi (request_failed) hoặc chậm quá 3000ms. Nếu lưu lượng đạt 100,000 requests, ngân sách lỗi tối đa là 500 requests."
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
